name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest matplotlib
      - name: Run test suite
        run: python -m pytest src/ -q
      - name: Full-machine CAD validation report
        run: python src/mixer_cad.py --report
      - name: Cross-specification analysis
        run: python src/mixer_analysis.py
      - name: 12-hour duty-cycle simulation (1 hr smoke)
        run: python src/mixer_simulation.py --hours 1
